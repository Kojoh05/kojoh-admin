<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>KOJOH Admin | Challenge submissions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="admin-core.js"></script>
<script>
KA.boot('submissions', function(ctx){
  var main = ctx.main;
  var filter = 'pending';
  var rows = [];
  var who = {};
  var datasetsById = {};

  main.innerHTML =
      '<div class="ka-head"><div><h1>Challenge submissions</h1>'
    +   '<p>The GitHub repo and LinkedIn post each buyer sent in once they finished their task pack. '
    +   'Award points once you\'ve checked the work, points then show on the public leaderboard.</p></div></div>'
    + '<div class="ka-filters">'
    +   '<div class="ka-seg" id="kaSubFilter">'
    +     '<button data-f="pending" class="on">Pending<span class="ka-segcount" data-c="pending"></span></button>'
    +     '<button data-f="reviewed">Reviewed<span class="ka-segcount" data-c="reviewed"></span></button>'
    +     '<button data-f="all">All<span class="ka-segcount" data-c="all"></span></button>'
    +   '</div>'
    + '</div>'
    + '<div id="kaSubBody"><div class="ka-empty">Loading</div></div>'
    + '<div class="ka-drawer" id="kaSubDrawer" hidden><div class="ka-drawer-panel" id="kaSubPanel"></div></div>';

  document.getElementById('kaSubFilter').addEventListener('click', function(e){
    var b = e.target.closest('button');
    if (!b) return;
    filter = b.getAttribute('data-f');
    Array.prototype.forEach.call(document.querySelectorAll('#kaSubFilter button'), function(x){
      x.classList.toggle('on', x === b);
    });
    renderTable();
  });

  loadAll();

  function loadAll(){
    document.getElementById('kaSubBody').innerHTML = '<div class="ka-empty">Loading</div>';
    KA.supa.from('challenge_submissions')
      .select('*, datasets(title, slug)')
      .order('submitted_at', { ascending: false })
      .then(function(r){
        if (r.error) {
          document.getElementById('kaSubBody').innerHTML = '<div class="ka-empty">' + KA.esc(r.error.message) + '</div>';
          return;
        }
        rows = r.data || [];
        var ids = rows.map(function(x){ return x.user_id; }).filter(Boolean);
        if (!ids.length) { renderTable(); return; }
        KA.supa.from('profiles').select('id, username, email').in('id', ids).then(function(p){
          who = {};
          (p.data || []).forEach(function(u){ who[u.id] = u; });
          renderTable();
        });
      });
  }

  function counts(){
    var c = { all: rows.length, pending: 0, reviewed: 0 };
    rows.forEach(function(r){ c[r.status] = (c[r.status] || 0) + 1; });
    Array.prototype.forEach.call(document.querySelectorAll('.ka-segcount'), function(el){
      el.textContent = c[el.getAttribute('data-c')] || 0;
    });
  }

  function renderTable(){
    counts();
    var host = document.getElementById('kaSubBody');
    var list = rows.filter(function(r){
      if (filter === 'all') return true;
      return r.status === filter;
    });

    if (!list.length) {
      host.innerHTML = '<div class="ka-card"><div class="ka-empty">'
        + (filter === 'pending' ? 'Nothing waiting on review.' : 'Nothing here yet.') + '</div></div>';
      return;
    }

    host.innerHTML = '<div class="ka-card"><table class="ka-table ka-table-cards"><thead><tr>'
      + '<th>Buyer</th><th>Dataset</th><th>License</th><th>Tasks</th>'
      + '<th>Links</th><th>Submitted</th><th>Status</th><th></th>'
      + '</tr></thead><tbody>'
      + list.map(rowHtml).join('')
      + '</tbody></table></div>';

    Array.prototype.forEach.call(host.querySelectorAll('[data-review]'), function(b){
      b.addEventListener('click', function(){ openDrawer(b.getAttribute('data-review')); });
    });
  }

  function rowHtml(s){
    var u = who[s.user_id];
    var ds = s.datasets || {};
    var reviewed = s.status === 'reviewed';
    var waited = Math.floor((Date.now() - new Date(s.submitted_at).getTime()) / 86400000);
    return '<tr>'
      + '<td data-label="Buyer">' + (u ? '<div class="ka-table-title">' + KA.esc(u.username) + '</div><div class="ka-table-sub">' + KA.esc(u.email) + '</div>' : 'Unknown') + '</td>'
      + '<td data-label="Dataset">' + KA.esc(ds.title || s.dataset_id) + '</td>'
      + '<td data-label="License">' + KA.esc(s.license_code) + '</td>'
      + '<td class="num" data-label="Tasks">' + KA.nf(s.tasks_done) + ' / ' + KA.nf(s.tasks_total) + '</td>'
      + '<td data-label="Links"><a href="' + KA.esc(s.github_url) + '" target="_blank" rel="noopener">GitHub</a> &middot; '
      +     '<a href="' + KA.esc(s.linkedin_url) + '" target="_blank" rel="noopener">LinkedIn</a></td>'
      + '<td data-label="Submitted">' + KA.esc(KA.date(s.submitted_at))
      +     (!reviewed && waited >= 2 ? '<div class="ka-table-sub" style="color:var(--danger);">waiting ' + waited + ' days</div>' : '') + '</td>'
      + '<td data-label="Status">' + (reviewed
          ? '<span class="ka-badge ka-badge-live">' + KA.nf(s.points || 0) + ' pts</span>'
          : '<span class="ka-badge">Pending</span>') + '</td>'
      + '<td><button class="ka-btn ka-btn-sm' + (reviewed ? '' : ' ka-btn-primary') + '" data-review="' + s.id + '">' + (reviewed ? 'Edit score' : 'Review') + '</button></td>'
      + '</tr>';
  }

  function openDrawer(id){
    var s = rows.filter(function(x){ return x.id === id; })[0];
    if (!s) return;
    var u = who[s.user_id];
    var ds = s.datasets || {};
    var drawer = document.getElementById('kaSubDrawer');
    var panel = document.getElementById('kaSubPanel');

    var queue = rows.filter(function(x){ return x.status === 'pending' && x.id !== s.id; });
    var PRESETS = [100, 250, 400, 500];
    panel.innerHTML =
        '<div class="ka-drawer-head"><div><h2>Score this submission</h2>'
      +   '<p class="ka-card-sub">' + (queue.length ? queue.length + ' more waiting after this one' : 'Last one in the queue') + '</p></div>'
      +   '<button class="ka-btn ka-btn-sm" id="kaSubClose" type="button">Close <span class="ka-kbd">Esc</span></button></div>'
      + '<p class="ka-hint" style="margin:0 0 1rem;">'
      +   '<strong>' + KA.esc(u ? u.username : 'Unknown buyer') + '</strong>' + (u ? ' &middot; ' + KA.esc(u.email) : '') + '<br>'
      +   KA.esc(ds.title || s.dataset_id) + ', license ' + KA.esc(s.license_code) + ', '
      +   KA.nf(s.tasks_done) + ' / ' + KA.nf(s.tasks_total) + ' tasks ticked, submitted ' + KA.esc(KA.date(s.submitted_at)) + '.'
      + '</p>'
      + '<a class="ka-linkcard" href="' + KA.esc(s.github_url) + '" target="_blank" rel="noopener"><span><span class="ka-linkcard-k">GitHub repo</span><br><span class="ka-linkcard-v">' + KA.esc(s.github_url) + '</span></span><span>&#8599;</span></a>'
      + '<a class="ka-linkcard" href="' + KA.esc(s.linkedin_url) + '" target="_blank" rel="noopener"><span><span class="ka-linkcard-k">LinkedIn post</span><br><span class="ka-linkcard-v">' + KA.esc(s.linkedin_url) + '</span></span><span>&#8599;</span></a>'
      + '<form id="kaSubForm" style="margin-top:1.1rem;">'
      +   '<div class="ka-field"><label class="ka-label" for="kaSubPoints">Points</label>'
      +   '<div class="ka-presets">' + PRESETS.map(function(p){ return '<button type="button" class="ka-preset' + (s.points === p ? ' on' : '') + '" data-p="' + p + '">' + p + '</button>'; }).join('') + '</div>'
      +   '<input class="ka-input" type="number" min="0" step="1" inputmode="numeric" id="kaSubPoints" value="' + (s.points == null ? '' : s.points) + '" required></div>'
      +   '<div class="ka-field"><label class="ka-label" for="kaSubNotes">Notes, admin only</label>'
      +   '<textarea class="ka-textarea" id="kaSubNotes" placeholder="What was strong, what was missing">' + KA.esc(s.admin_notes || '') + '</textarea></div>'
      +   '<div class="ka-btnrow">'
      +     (queue.length ? '<button class="ka-btn ka-btn-primary" type="submit" data-next="1">Save and next</button>' : '')
      +     '<button class="ka-btn' + (queue.length ? '' : ' ka-btn-primary') + '" type="submit">'
      +       (s.status === 'reviewed' ? 'Update score' : 'Save and close') + '</button>'
      +   '</div>'
      +   '<p class="ka-hint">Ctrl + Enter saves and moves to the next one.</p>'
      +   '<p class="ka-gate-err" id="kaSubErr"></p>'
      + '</form>';
    drawer.hidden = false;

    function close(){ drawer.hidden = true; document.removeEventListener('keydown', onKey); }
    function onKey(ev){
      if (ev.key === 'Escape') { ev.preventDefault(); close(); }
      if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); save(!!queue.length); }
    }
    document.addEventListener('keydown', onKey);
    document.getElementById('kaSubClose').addEventListener('click', close);
    drawer.onclick = function(ev){ if (ev.target === drawer) close(); };

    var ptsInput = document.getElementById('kaSubPoints');
    Array.prototype.forEach.call(panel.querySelectorAll('.ka-preset'), function(b){
      b.addEventListener('click', function(){
        ptsInput.value = b.getAttribute('data-p');
        Array.prototype.forEach.call(panel.querySelectorAll('.ka-preset'), function(x){ x.classList.toggle('on', x === b); });
      });
    });
    ptsInput.addEventListener('input', function(){
      Array.prototype.forEach.call(panel.querySelectorAll('.ka-preset'), function(x){ x.classList.toggle('on', x.getAttribute('data-p') === ptsInput.value); });
    });
    setTimeout(function(){ ptsInput.focus(); }, 60);

    var form = document.getElementById('kaSubForm');
    form.addEventListener('submit', function(ev){
      ev.preventDefault();
      var next = ev.submitter && ev.submitter.getAttribute('data-next') === '1';
      save(next);
    });

    var saving = false;
    function save(goNext){
      if (saving) return;
      var pts = parseInt(ptsInput.value, 10);
      var notes = document.getElementById('kaSubNotes').value;
      var err = document.getElementById('kaSubErr');
      if (!(pts >= 0)) { err.textContent = 'Points needs to be zero or more.'; ptsInput.focus(); return; }
      saving = true;
      err.textContent = '';
      Array.prototype.forEach.call(form.querySelectorAll('button[type="submit"]'), function(b){ b.disabled = true; });

      KA.supa.from('challenge_submissions').update({
        points: pts,
        admin_notes: notes,
        status: 'reviewed',
        reviewed_by: ctx.session ? ctx.session.user.id : null,
        reviewed_at: new Date().toISOString()
      }).eq('id', s.id).then(function(r){
        saving = false;
        if (r.error) {
          Array.prototype.forEach.call(form.querySelectorAll('button[type="submit"]'), function(b){ b.disabled = false; });
          err.textContent = r.error.message;
          return;
        }
        s.points = pts; s.admin_notes = notes; s.status = 'reviewed';
        KA.toast(pts + ' points saved for ' + (u ? u.username : 'this buyer') + '.');
        if (KA.refreshShellBadges) KA.refreshShellBadges();
        renderTable();
        document.removeEventListener('keydown', onKey);
        if (goNext && queue.length) { openDrawer(queue[0].id); return; }
        drawer.hidden = true;
      });
    }
  }
});
</script>
</body>
</html>
